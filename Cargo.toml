[package]
name = "wist-release"
version = "0.4.0" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "wist 发布域纯逻辑：安装包身份解析（version/arch）+ 发布计划灰度（切阶段与推进闸门）。不含存储、端点、鉴权。"
repository = "https://github.com/dayu-sec/wist-release"
homepage = "https://github.com/dayu-sec/wist-release"
documentation = "https://docs.rs/wist-release"
readme = "README.md"
keywords = ["wist", "release", "rollout", "canary", "package"]
categories = ["data-structures", "network-programming"]

[dependencies]
# 制品的传输与校验（取来源 / 摘要 / 版本比较 / 命名与路径安全）在底座 crate；
# 本仓 `package` 模块原样转出它，让 center / gateway 的调用点不必改。
wist-artifact = { version = "0.1" }
# 只服务于**身份解析**（解包取顶层目录名）：flate2 默认走纯 Rust 后端（miniz_oxide）。
# 正因为只有这一层需要解包，被管端（agentd）才不该依赖本 crate。
flate2 = "1"
tar = "0.4"

[lib]
path = "src/lib.rs"
